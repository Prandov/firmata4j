name: Java 21 Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
